info:
  contact: {}
  description: This is the clinical data repository API.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Clinical Data Repository API
  version: "1.0"
paths:
  /api/v1/allergyintolerance:
    get:
      consumes:
      - application/json
      description: List the allergies of the patient given by the ID
      parameters:
      - description: Clinical Organizatin ID
        in: header
        name: Clinical-Organization-ID
        required: true
        type: string
      - description: Clinical-Facility-ID
        in: header
        name: Clinical-Facility-ID
        required: true
        type: string
      - description: Patient ID
        in: query
        name: patient_id
        required: true
        type: string
      - description: Forward pagination argument
        in: query
        name: limit
        type: string
      - description: Forward pagination argument
        in: query
        name: after
        type: string
      - description: Backward pagination argument
        in: query
        name: last
        type: string
      - description: Backward pagination argument
        in: query
        name: before
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AllergyConnection'
        "400":
          description: 'Error: Bad Request'
          schema:
            $ref: '#/definitions/rest.APIResponse'
        "401":
          description: 'Error: Not Authorized'
          schema:
            $ref: '#/definitions/rest.APIResponse'
        "404":
          description: 'Error: Not Found'
          schema:
            $ref: '#/definitions/rest.APIResponse'
        "500":
          description: 'Error: InternalServerError'
          schema:
            $ref: '#/definitions/rest.APIResponse'
      security:
      - OAuth2Password: []
      summary: 'read-instances: List patient allergies'
      tags:
      - AllergyIntolerance
    post:
