version: "2"
run:
  timeout: 10m
  concurrency: 4
  tests: false
linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - errcheck
    - errorlint
    - gocritic
    - gosec
    - govet
    - importas
    - ineffassign
    - ireturn
    - makezero
    - misspell
    - nilerr
    - reassign
    # - revive
    - staticcheck
    - unparam
    - unused
    - wsl_v5
  settings:
    funlen:
      lines: -1
      statements: -1
    revive:
      rules:
        - name: unused-parameter
          arguments:
            - allowRegex: ^_
          severity: warning
          disabled: true
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2
    staticcheck:
      checks:
        - "all"
        - "-ST1003"
        - "-ST1016"
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - pkg/clinical/presentation/graph/
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - pkg/clinical/presentation/graph/
      - third_party$
      - builtin$
      - examples$
